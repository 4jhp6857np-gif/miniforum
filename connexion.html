<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniForum - Connexion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="entete">
        <h1>MiniForum</h1>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="index.html#sujets">Sujets</a></li>
                <li><a href="inscription.html">Inscription</a></li>
                <li><a href="connexion.html">Connexion</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Connexion</h2>

        <form action="/connexion" method="post">
            <fieldset>
                <legend>Vos identifiants</legend>

                <p>
                    <strong><label for="identifiant">Pseudo ou adresse e-mail</label></strong>
                    <input type="text" id="identifiant" name="identifiant" required>
                </p>

                <p>
                    <strong><label for="motdepasse">Mot de passe</label></strong>
                    <input type="password" id="motdepasse" name="motdepasse" required>
                </p>
            </fieldset>

            <div class="actions-compte">
                <button class="bouton" type="submit">Se connecter</button>
                <a href="inscription.html">Pas encore de compte ? S’inscrire</a>
            </div>
        </form>
    </main>

    <footer class="pied">
        <!-- Pied de page -->
    </footer>
</body>
</html>
